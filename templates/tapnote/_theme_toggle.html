<button
    type="button"
    data-theme-toggle
    class="inline-flex items-center justify-center min-w-20 whitespace-nowrap px-4 py-2 text-sm text-black border border-black rounded-full hover:bg-black hover:text-white transition-colors dark:text-white dark:border-white dark:hover:bg-white dark:hover:text-black"
    aria-label="Switch to dark mode"
    title="Switch to dark mode"
>
    <span data-theme-label-dark>Dark</span>
    <span data-theme-label-light>Light</span>
</button>
