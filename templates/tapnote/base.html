{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}scrbl{% endblock %}</title>
    <link rel="icon" type="image/png" sizes="32x32" href="{% static 'favicon-32.png' %}">
    <link rel="icon" type="image/png" sizes="16x16" href="{% static 'favicon-16.png' %}">
    <link rel="icon" type="image/png" sizes="192x192" href="{% static 'favicon-192.png' %}">
    <link rel="apple-touch-icon" sizes="180x180" href="{% static 'apple-touch-icon.png' %}">
    <link rel="shortcut icon" href="{% static 'favicon.ico' %}">
    <script>
        (function () {
            try {
                if (localStorage.getItem('scrbl-theme') === 'dark') {
                    document.documentElement.classList.add('dark');
                }
            } catch (error) {
                // Storage can be unavailable in private browsing; default to light.
            }
        })();
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        if (window.tailwind) {
            tailwind.config = { darkMode: 'class' };
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link href="{% static 'css/styles.css' %}?v=20261023e" rel="stylesheet">
    {% block meta %}{% endblock %}
</head>
<body class="bg-white text-black min-h-screen dark:bg-black dark:text-white">
    {% block content %}{% endblock %}
    <script src="{% static 'js/theme.js' %}?v=20261023e"></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
