name: Build and Push scrbl to GHCR

on:
  workflow_dispatch:
    inputs:
      tags:
        description: 'Comma-separated list of tags (e.g. "latest,v0.2.0")'
        required: true
        type: string
        default: 'latest'

env:
  REPO_URL: 'https://github.com/driftywinds/scrbl'
  IMAGE_NAME: 'driftywinds/scrbl'

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: target-repo

      - name: Record commit info
        run: |
          cd ./target-repo
          echo "REPO_COMMIT=$(git rev-parse HEAD)" >> $GITHUB_ENV
          echo "REPO_SHORT_COMMIT=$(git rev-parse --short HEAD)" >> $GITHUB_ENV

      - name: Detect Dockerfile location
        id: dockerfile
        run: |
          cd ./target-repo
          if [[ -f "Dockerfile" ]]; then
            DOCKERFILE_PATH="Dockerfile"
          elif [[ -f "docker/Dockerfile" ]]; then
            DOCKERFILE_PATH="docker/Dockerfile"
          else
            echo "Error: No Dockerfile found in root or docker/ directory"
            exit 1
          fi
          echo "path=$DOCKERFILE_PATH" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate tags
        id: meta
        run: |
          IFS=',' read -ra TAG_ARRAY <<< "${{ inputs.tags }}"
          ALL_TAGS=""
          for tag in "${TAG_ARRAY[@]}"; do
            tag=$(echo "$tag" | xargs)
            [[ -z "$tag" ]] && continue
            if [[ -n "$ALL_TAGS" ]]; then
              ALL_TAGS="$ALL_TAGS,"
            fi
            ALL_TAGS="${ALL_TAGS}ghcr.io/${IMAGE_NAME}:${tag}"
          done
          echo "tags=$ALL_TAGS" >> $GITHUB_OUTPUT
          echo "Generated tags: $ALL_TAGS"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./target-repo
          file: ./target-repo/${{ steps.dockerfile.outputs.path }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.title=teledoc
            org.opencontainers.image.description=Built from ${{ env.REPO_URL }}
            org.opencontainers.image.url=${{ env.REPO_URL }}
            org.opencontainers.image.source=${{ env.REPO_URL }}
            org.opencontainers.image.revision=${{ env.REPO_COMMIT }}
            org.opencontainers.image.created=${{ github.event.head_commit.timestamp }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "**Repository:** $REPO_URL" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ env.REPO_SHORT_COMMIT }}" >> $GITHUB_STEP_SUMMARY
          echo "**Dockerfile:** ${{ steps.dockerfile.outputs.path }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Built Tags:" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" | tr ',' '\n' | sed 's/^/- /' >> $GITHUB_STEP_SUMMARY
